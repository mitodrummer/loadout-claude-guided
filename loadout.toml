description = "Claude Code for people who don't write code: describe a change, review it in the browser, and Claude opens the pull request"

packages = ["claude-code", "git", "gh", "jq", "ripgrep", "fd"]

# Every source is under this loadout's directory, so it works wherever it is
# cloned. Patched files land 0644; the hook below restores the exec bit.
patches = [
    { dest = ".local/bin/guided-session",                source = "$LOADOUT_ROOT/bin/guided-session", description = "attach: GitHub sign-in, then Claude Code" },
    { dest = ".local/bin/pr-ready",                      source = "$LOADOUT_ROOT/bin/pr-ready",       description = "whether a pull request is ready for review" },
    { dest = ".local/share/claude-guided/CLAUDE.md.in",  source = "$LOADOUT_ROOT/share/CLAUDE.md.in", description = "how Claude works with you; filled in at attach" },
    { dest = ".claude/skills/report-issue/SKILL.md",     source = "$LOADOUT_ROOT/skills/report-issue/SKILL.md", description = "turns a bug or idea into a GitHub issue" },

    # Written by ./setup and gitignored. A missing source is skipped, so the
    # loadout activates before setup has run. The git identity comes from
    # your GitHub account at attach.
    { dest = ".config/claude-guided/config", source = "$LOADOUT_ROOT/local/config",   description = "your settings (see config.example)" },
]

[[lifecycle_hooks]]
description = "Make the patched scripts executable and skip Claude Code's first-run onboarding"
on_activate = { type = "inline", value = '''chmod +x "$HOME"/.local/bin/guided-session "$HOME"/.local/bin/pr-ready 2>/dev/null; [ -f "$HOME/.claude.json" ] || printf '{"hasCompletedOnboarding": true}\n' > "$HOME/.claude.json"''' }

[vars]
# The attach shell reads no rc files, so Claude starts from the first prompt.
PROMPT_COMMAND = 'unset PROMPT_COMMAND; bash "$HOME/.local/bin/guided-session"'

# Shows the minimal.dev webapp's "Sign in as test user / test staff" buttons
# on its dev server, so signed-in and staff pages can be checked without
# GitHub keys or email. Only `astro dev` reads it; other projects ignore it.
DEV_TEST_SIGN_IN = "true"

# Each is taken from your host shell when set and dropped otherwise.
# GH_TOKEN is how a host `gh` sign-in reaches the session: activate with
# GH_TOKEN="$(gh auth token)" and guided-session skips `gh auth login`.
GH_TOKEN                = { inherit = true }
TERM                    = { inherit = true, default = "xterm-256color" }
COLORTERM               = { inherit = true }
